<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogos POA - GAMCH</title>
    <link href="css/output.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f1f5f9; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Menú Lateral -->
    <aside class="w-72 bg-gradient-to-b from-slate-900 via-indigo-900 to-indigo-800 text-white flex flex-col shadow-2xl">
        <div class="p-8 border-b border-indigo-700">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center shadow-lg text-indigo-800">🏛️</div>
                <div>
                    <h1 class="font-bold text-2xl">GAMCH</h1>
                    <p class="text-indigo-200 text-sm">Sistema Municipal</p>
                </div>
            </div>
        </div>
        <nav class="flex-1 p-5 space-y-2">
            <a href="index.html" class="flex items-center gap-3 rounded-xl px-5 py-4 transition hover:bg-white/10">
                <i data-lucide="layout-dashboard"></i> Bandeja de Procesos
            </a>
            <a href="nuevo_proceso.html" class="flex items-center gap-3 rounded-xl px-5 py-4 transition hover:bg-white/10">
                <i data-lucide="file-input"></i> Recepción (Ventanilla)
            </a>
            <a href="catalogos.html" class="flex items-center gap-3 bg-white/15 rounded-xl px-5 py-4 transition hover:bg-white/20">
                <i data-lucide="database"></i> Gestión Catálogos
            </a>
        </nav>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 overflow-y-auto">
        <header class="bg-white border-b px-10 py-6">
            <h1 class="text-3xl font-bold text-slate-800">Gestión de Catálogo POA</h1>
            <p class="text-gray-500 mt-1">Administración centralizada de Programas, Proyectos y Partidas Presupuestarias.</p>
        </header>

        <!-- EL COMPONENTE QUE CREAMOS ANTES -->
        <div class="p-8 max-w-7xl mx-auto space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                
                <!-- 1. NUEVO PROGRAMA -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-indigo-700 mb-4 border-b pb-2">1. Nuevo Programa</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">CÓDIGO</label>
                            <input type="text" id="admin-prog-cod" class="w-full p-2 bg-slate-50 border rounded-lg text-sm focus:border-indigo-500 outline-none" placeholder="Ej. 210">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">NOMBRE DEL PROGRAMA</label>
                            <input type="text" id="admin-prog-nom" class="w-full p-2 bg-slate-50 border rounded-lg text-sm focus:border-indigo-500 outline-none" placeholder="Ej. GESTIÓN DE EDUCACIÓN">
                        </div>
                        <button onclick="guardarAdminPrograma()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg text-sm transition">Guardar Programa</button>
                    </div>
                </div>

                <!-- 2. NUEVO PROYECTO / ACTIVIDAD -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-emerald-700 mb-4 border-b pb-2">2. Nuevo Proyecto</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">PROGRAMA PADRE</label>
                            <select id="admin-proy-prog" class="w-full p-2 bg-slate-50 border rounded-lg text-sm focus:border-emerald-500 outline-none">
                                <option value="">-- Seleccionar --</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">CÓD. PROYECTO</label>
                                <input type="text" id="admin-proy-cod" class="w-full p-2 bg-slate-50 border rounded-lg text-sm focus:border-emerald-500 outline-none" placeholder="Ej. 0000">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">ACTIVIDAD</label>
                                <input type="text" id="admin-proy-act" class="w-full p-2 bg-slate-50 border rounded-lg text-sm focus:border-emerald-500 outline-none" placeholder="Ej. 001">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">NOMBRE DEL PROYECTO</label>
                            <input type="text" id="admin-proy-nom" class="w-full p-2 bg-slate-50 border rounded-lg text-sm focus:border-emerald-500 outline-none" placeholder="Ej. APOYO FUNCIONAMIENTO...">
                        </div>
                        <button onclick="guardarAdminProyecto()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-lg text-sm transition">Guardar Proyecto</button>
                    </div>
                </div>

                <!-- 3. NUEVA PARTIDA -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-amber-700 mb-4 border-b pb-2">3. Nueva Partida</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">PROGRAMA</label>
                            <select id="admin-part-prog" class="w-full p-2 bg-slate-50 border rounded-lg text-sm focus:border-amber-500 outline-none" onchange="cargarSelectProyectos()">
                                <option value="">-- Seleccionar --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">PROYECTO PADRE</label>
                            <select id="admin-part-proy" class="w-full p-2 bg-slate-50 border rounded-lg text-sm focus:border-amber-500 outline-none">
                                <option value="">-- Seleccionar --</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">CÓDIGO Y DESCRIPCIÓN</label>
                            <div class="flex gap-2">
                                <input type="text" id="admin-part-cod" class="w-24 p-2 bg-slate-50 border rounded-lg text-sm focus:border-amber-500 outline-none text-center" placeholder="39500">
                                <input type="text" id="admin-part-desc" class="flex-1 p-2 bg-slate-50 border rounded-lg text-sm focus:border-amber-500 outline-none" placeholder="Ej. Útiles">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">FF</label>
                                <input type="text" id="admin-part-ff" class="w-full p-2 bg-slate-50 border rounded-lg text-sm focus:border-amber-500 outline-none text-center" placeholder="41">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-500 mb-1">OF</label>
                                <input type="text" id="admin-part-of" class="w-full p-2 bg-slate-50 border rounded-lg text-sm focus:border-amber-500 outline-none text-center" placeholder="113">
                            </div>
                        </div>
                        <button onclick="guardarAdminPartida()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-lg text-sm transition">Guardar Partida</button>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>lucide.createIcons();</script>
    <script src="js/api.js"></script>
    <script src="js/gestion_poa.js"></script>
    <script>
    if (!["ADMIN", "RPC", "PRESUPUESTO"].includes(localStorage.getItem("user_rol"))) {
        window.location.replace("index.html");
    }
</script>
</body>
</html>
