<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bandeja de Correspondencia - GAMCH</title>
    <link href="css/output.css?v=2.0" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <script src="js/auth.js"></script>
    <script>
        window.LAYOUT_CONFIG = {
            titulo: "Bandeja de Correspondencia",
            subtitulo: "Recepción, atención y derivación de notas entrantes a la Alcaldía"
        };
    </script>
</head>

<body class="bg-slate-50 text-slate-800 antialiased h-screen overflow-hidden flex">

    <!-- SIDEBAR DINÁMICO -->
    <aside id="app-sidebar"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 flex flex-col min-w-0 overflow-y-auto bg-slate-50">
        <!-- HEADER SUPERIOR DINÁMICO -->
        <header id="app-header"></header>

        <!-- ÁREA DE DASHBOARD / BANDEJA -->
        <div class="p-8 space-y-6 max-w-[1600px] mx-auto w-full">

            <!-- TARJETAS DE MÉTICAS / KPI INTERACTIVAS (REPLICADO DE BANDEJA DE CONTRATACIONES) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <!-- TOTAL CORRESPONDENCIA -->
                <div id="card-kpi-total" onclick="cambiarFiltroEstado('TODOS')"
                    class="bg-white rounded-xl p-5 border border-slate-200 shadow-xs flex items-center justify-between cursor-pointer hover:shadow-md hover:border-slate-400 hover:-translate-y-0.5 transition-all group">
                    <div>
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-wide group-hover:text-slate-700 transition">Total Correspondencia</p>
                        <h2 id="kpi-corr-total" class="text-3xl font-extrabold text-slate-900 mt-1 tabular-nums">0</h2>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center border border-slate-200 group-hover:bg-slate-900 group-hover:text-white transition">
                        <i data-lucide="file-text" class="w-6 h-6"></i>
                    </div>
                </div>

                <!-- EN BANDEJA -->
                <div id="card-kpi-bandeja" onclick="cambiarFiltroEstado('EN_BANDEJA')"
                    class="bg-white rounded-xl p-5 border border-slate-200 shadow-xs flex items-center justify-between cursor-pointer hover:shadow-md hover:border-amber-400 hover:-translate-y-0.5 transition-all group">
                    <div>
                        <p class="text-xs font-bold text-amber-700 uppercase tracking-wide group-hover:text-amber-900 transition">En Bandeja</p>
                        <h2 id="kpi-corr-bandeja" class="text-3xl font-extrabold text-amber-800 mt-1 tabular-nums">0</h2>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-700 flex items-center justify-center border border-amber-200 group-hover:bg-amber-600 group-hover:text-white transition">
                        <i data-lucide="inbox" class="w-6 h-6"></i>
                    </div>
                </div>

                <!-- EN PROCESO -->
                <div id="card-kpi-proceso" onclick="cambiarFiltroEstado('EN_PROCESO')"
                    class="bg-white rounded-xl p-5 border border-slate-200 shadow-xs flex items-center justify-between cursor-pointer hover:shadow-md hover:border-blue-400 hover:-translate-y-0.5 transition-all group">
                    <div>
                        <p class="text-xs font-bold text-blue-700 uppercase tracking-wide group-hover:text-blue-900 transition">En Proceso</p>
                        <h2 id="kpi-corr-proceso" class="text-3xl font-extrabold text-blue-800 mt-1 tabular-nums">0</h2>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center border border-blue-200 group-hover:bg-blue-900 group-hover:text-white transition">
                        <i data-lucide="clock" class="w-6 h-6"></i>
                    </div>
                </div>

                <!-- RESPONDIDOS -->
                <div id="card-kpi-respondidos" onclick="cambiarFiltroEstado('RESPONDIDO')"
                    class="bg-white rounded-xl p-5 border border-slate-200 shadow-xs flex items-center justify-between cursor-pointer hover:shadow-md hover:border-emerald-400 hover:-translate-y-0.5 transition-all group">
                    <div>
                        <p class="text-xs font-bold text-emerald-700 uppercase tracking-wide group-hover:text-emerald-900 transition">Respondidos</p>
                        <h2 id="kpi-corr-respondidos" class="text-3xl font-extrabold text-emerald-800 mt-1 tabular-nums">0</h2>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center border border-emerald-200 group-hover:bg-emerald-700 group-hover:text-white transition">
                        <i data-lucide="check-circle-2" class="w-6 h-6"></i>
                    </div>
                </div>
            </div>

            <!-- CONTENEDOR DE LA TABLA -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                <!-- BARRA SUPERIOR DE FILTROS Y PESTAÑAS -->
                <div class="p-4 bg-slate-50 border-b border-slate-200 flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                        <button onclick="cambiarFiltroEstado('TODOS')" id="btn-filtro-todos"
                            class="px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-xs border border-slate-200">Todos</button>
                        <button onclick="cambiarFiltroEstado('EN_BANDEJA')" id="btn-filtro-bandeja"
                            class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-900">En Bandeja</button>
                        <button onclick="cambiarFiltroEstado('EN_PROCESO')" id="btn-filtro-proceso"
                            class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-900">En Proceso</button>
                        <button onclick="cambiarFiltroEstado('RESPONDIDO')" id="btn-filtro-respondidos"
                            class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-900">Respondidos</button>
                        <button onclick="cambiarFiltroEstado('PROMOVIDO_A_COMPRA')" id="btn-filtro-promovidos"
                            class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-500 hover:text-slate-900">Promovidos a Compra</button>
                    </div>

                    <div class="flex items-center gap-3">
                        <div id="contenedor-filtro-unidad" class="hidden">
                            <select id="filtro-unidad" onchange="cargarCorrespondencias()"
                                class="text-xs bg-white border border-slate-200 rounded-xl px-3 py-2 font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500">
                                <option value="">Todas las Unidades</option>
                            </select>
                        </div>

                        <div class="relative w-64">
                            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                            <input type="text" id="buscador" oninput="filtrarCorrespondencias()"
                                placeholder="Buscar CITE, Remitente o Asunto..."
                                class="w-full text-xs bg-white border border-slate-200 rounded-xl pl-9 pr-3 py-2 font-medium text-slate-800 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500">
                        </div>
                    </div>
                </div>

                <!-- TABLA DE CORRESPONDENCIAS -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr
                                class="bg-slate-100/80 text-slate-600 font-bold text-[11px] uppercase tracking-wider border-b border-slate-200">
                                <th class="px-6 py-3">Hoja de Ruta</th>
                                <th class="px-6 py-3">Remitente / Origen</th>
                                <th class="px-6 py-3">Asunto / Referencia</th>
                                <th class="px-6 py-3">Unidad Asignada</th>
                                <th class="px-6 py-3">Estado</th>
                                <th class="px-6 py-3 text-center">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-correspondencia" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="6" class="py-12 text-center text-slate-400 italic">Cargando
                                    correspondencias...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- MODAL LEGACY: INGRESO DE CORRESPONDENCIA (mantener para compatibilidad) -->
    <div id="modal-ingreso-correspondencia"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div
            class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-2xl overflow-hidden flex flex-col my-auto max-h-[92vh]">
            <header class="px-6 py-4 bg-slate-900 text-white flex justify-between items-center shrink-0">
                <div class="flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-400"></i>
                    <h3 class="font-bold text-sm">Registrar Ingreso de Correspondencia</h3>
                </div>
                <button onclick="cerrarModalNuevaCorrespondencia()"
                    class="p-1.5 text-slate-400 hover:text-white rounded-lg transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </header>

            <form id="form-nueva-correspondencia" onsubmit="guardarNuevaCorrespondencia(event)"
                class="p-6 space-y-4 overflow-y-auto flex-1">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Tipo Remitente *</label>
                        <select id="tipo_remitente"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium text-slate-800">
                            <option value="INSTITUCIONAL">OTB / Comunidad / Entidad Pública</option>
                            <option value="PARTICULAR">Persona Particular</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Nombre del Remitente / Firmante
                            *</label>
                        <input type="text" id="nombre_remitente" required placeholder="Ej: Pedro Quispe Aduviri"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium text-slate-800">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Cargo del Remitente</label>
                        <input type="text" id="cargo_remitente" placeholder="Ej: Presidente de OTB Charaña"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium text-slate-800">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Teléfono / Celular Contacto</label>
                        <input type="text" id="telefono_remitente" placeholder="Ej: 71543210"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium text-slate-800">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">CITE del Documento</label>
                        <input type="text" id="cite_origen" placeholder="Ej: CITE N° 045/2026"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium text-slate-800">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Fecha Doc. Origen</label>
                        <input type="date" id="fecha_doc_origen"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium text-slate-800">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Tipo Documento *</label>
                        <select id="tipo_documento"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium text-slate-800">
                            <option value="CARTA">Carta / Oficio</option>
                            <option value="SOLICITUD">Solicitud Directa</option>
                            <option value="MEMORIAL">Memorial</option>
                            <option value="INFORME">Informe Técnico Ext.</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Asunto / Referencia del Trámite *</label>
                    <textarea id="asunto_corr" required rows="2"
                        placeholder="Ej: Solicitud de adquisición de material escolar para 18 U.E. del Municipio de Charaña"
                        class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium text-slate-800"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">N° Fojas (Páginas)</label>
                        <input type="number" id="nro_fojas" min="1" value="1"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium text-slate-800">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Unidad Destino (Derivar a) *</label>
                        <select id="unidad_destino_id" required
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
                            <!-- Cargar dinámicamente -->
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Instrucción / Proveído Inicial</label>
                    <input type="text" id="instruccion_proveido" value="Para su atención y trámite correspondiente"
                        class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-xs font-medium text-slate-800">
                </div>

                <div class="pt-4 border-t border-slate-200 flex justify-end gap-3">
                    <button type="button" onclick="cerrarModalNuevaCorrespondencia()"
                        class="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition">Cancelar</button>
                    <button type="submit"
                        class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-md transition flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i> Registrar e Imprimir HR
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS JS -->
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/correspondencia.js"></script>
</body>

</html>
