<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventanilla Única - GAMCH</title>
    <link href="css/output.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f1f5f9; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-72 bg-gradient-to-b from-slate-900 via-indigo-900 to-indigo-800 text-white flex flex-col shadow-2xl">
        <div class="p-8 border-b border-indigo-700">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 rounded-2xl bg-white flex items-center justify-center shadow-lg text-indigo-800">🏛️</div>
                <div>
                    <h1 class="font-bold text-2xl">GAMCH</h1>
                    <p class="text-indigo-200 text-sm">Sistema Municipal</p>
                </div>
            </div>
        </div>
        <nav class="flex-1 p-5 space-y-2">
            <a href="index.html" class="flex items-center gap-3 rounded-xl px-5 py-4 transition hover:bg-white/10">
                <i data-lucide="layout-dashboard"></i> Bandeja de Procesos
            </a>
            <a href="nuevo_proceso.html" class="flex items-center gap-3 bg-white/15 rounded-xl px-5 py-4 transition hover:bg-white/20">
                <i data-lucide="file-input"></i> Recepción (Ventanilla)
            </a>
            <a id="menu-catalogos" href="catalogos.html" class="flex items-center gap-3 rounded-xl px-5 py-4 transition hover:bg-white/10">
                <i data-lucide="database"></i> Gestión Catálogos
            </a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <header class="bg-white border-b px-10 py-6">
            <h1 class="text-3xl font-bold text-slate-800">Recepción de Trámites</h1>
            <p class="text-gray-500 mt-1">Ventanilla Única: Ingreso de solicitudes y derivación a unidades.</p>
        </header>

        <section class="p-10 max-w-4xl mx-auto">
            <form id="form-proceso" class="space-y-8">
                
                <div class="bg-white rounded-3xl shadow p-8 border border-slate-200">
                    <h3 class="text-xl font-bold border-b pb-4 mb-6 text-indigo-800 flex items-center gap-2">
                        <i data-lucide="info" class="w-5 h-5"></i> 1. Datos de Ingreso
                    </h3>
                    
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha de Ingreso</label>
                            <input type="date" id="fecha_solicitud" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Número de Hoja de Ruta</label>
                            <input type="text" id="hoja_ruta" required placeholder="Ej. HR-2026-045" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none focus:border-indigo-500 font-mono text-indigo-700 font-bold">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Resumen / Objeto de la Solicitud</label>
                            <textarea id="objeto" required rows="3" placeholder="Ej. Solicitud de compra de llantas para la maquinaria pesada del municipio..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none focus:border-indigo-500"></textarea>
                        </div>
                        <div class="col-span-2" id="contenedor_derivacion">
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Derivar a: (Área Solicitante / Técnica)</label>
                            <!-- La secretaria elige a quién le toca armar este trámite -->
                            <select id="area_solicitante" required class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg outline-none focus:border-indigo-500 font-bold text-slate-700">
                                <option value="">Seleccione el Área a derivar...</option>
                                <!-- Agrega más áreas según tu organigrama -->
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-indigo-50 rounded-3xl shadow-sm p-8 border border-indigo-100">
                    <h3 class="text-xl font-bold border-b border-indigo-200 pb-4 mb-6 text-indigo-900 flex items-center gap-2">
                        <i data-lucide="paperclip" class="w-5 h-5"></i> 2. Respaldo Documental
                    </h3>
                    <div class="flex items-center gap-4 bg-white p-4 rounded-xl border border-indigo-100 shadow-sm">
                        <i data-lucide="file-text" class="text-red-500 w-10 h-10 shrink-0"></i>
                        <div class="flex-1">
                            <label class="block text-sm font-bold text-slate-700 mb-1">PDF de la Solicitud Inicial (Obligatorio)</label>
                            <input type="file" id="pdf_solicitud" accept=".pdf" required class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-100 file:text-indigo-700 hover:file:bg-indigo-200 cursor-pointer transition">
                        </div>
                    </div>
                </div>

                <div class="flex justify-end items-center gap-4 pt-4">
                    <a href="index.html" class="px-6 py-3 rounded-xl border border-slate-300 font-semibold text-slate-600 hover:bg-slate-100 transition">Cancelar</a>
                    <button type="submit" id="btn-guardar" class="px-8 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-700 transition shadow-lg flex items-center gap-2">
                        <i data-lucide="send" class="w-5 h-5"></i> Ingresar Trámite y Derivar
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script>lucide.createIcons();</script>
    <script src="js/api.js"></script>
    <script src="js/proceso.js"></script>
</body>
</html>
