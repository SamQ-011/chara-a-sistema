<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Solicitud de Contratación - GAMCH</title>
    <link href="css/output.css?v=2.0" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f8fafc;
        }
    </style>
    <script src="js/auth.js"></script>
    <script>
        window.LAYOUT_CONFIG = {
            titulo: "Nueva Solicitud de Contratación",
            subtitulo: "Ingreso de solicitud interna de compra o servicio con respaldo PDF",
            badge: "UNIDAD SOLICITANTE"
        };
    </script>
</head>

<body class="flex h-screen overflow-hidden text-slate-900 bg-slate-50">

    <!-- SIDEBAR DINÁMICO -->
    <aside id="app-sidebar"></aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-1 overflow-y-auto flex flex-col bg-slate-50">
        <!-- HEADER SUPERIOR DINÁMICO -->
        <header id="app-header"></header>

        <!-- FORMULARIO DE SOLICITUD DE TRÁMITE -->
        <section class="p-8 max-w-3xl w-full mx-auto space-y-6">
            <form id="form-proceso" class="space-y-6">
                <div class="bg-white rounded-2xl p-7 border border-slate-200 shadow-xs space-y-6">
                    <div class="flex items-center justify-between pb-4 border-b border-slate-100">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-indigo-50 text-indigo-600 border border-indigo-100 flex items-center justify-center font-bold shadow-xs">
                                <i data-lucide="file-plus" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h3 class="text-base font-bold text-slate-800">Nueva Solicitud de Trámite</h3>
                                <p class="text-xs text-slate-500">Ingrese los 4 datos de la solicitud inicial para registrar el trámite.</p>
                            </div>
                        </div>
                        <span class="text-xs font-medium text-slate-400">* Campos obligatorios</span>
                    </div>

                    <div class="space-y-5">
                        <!-- 1. Área Solicitante -->
                        <div id="contenedor_derivacion">
                            <label for="area_solicitante" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Área Solicitante <span class="text-rose-600">*</span></label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                                    <i data-lucide="building-2" class="w-4 h-4"></i>
                                </div>
                                <select id="area_solicitante" required class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 outline-none transition appearance-none cursor-pointer">
                                    <option value="">Seleccione el Área Solicitante...</option>
                                </select>
                                <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                                </div>
                            </div>
                        </div>

                        <!-- 2. Objeto / Nombre de la Solicitud -->
                        <div>
                            <label for="objeto" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Objeto (Nombre de la Solicitud) <span class="text-rose-600">*</span></label>
                            <textarea id="objeto" required rows="3" placeholder="Ej: Solicitud de adquisición de materiales e insumos de escritorio..." class="w-full p-3.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium text-slate-800 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 outline-none transition resize-none"></textarea>
                        </div>

                        <!-- 3. Fecha de Solicitud -->
                        <div>
                            <label for="fecha_solicitud" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Fecha de Solicitud <span class="text-rose-600">*</span></label>
                            <input type="date" id="fecha_solicitud" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-600/20 outline-none transition">
                        </div>

                        <!-- 4. Subir PDF Dropzone -->
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Documento Escaneado (PDF) <span class="text-rose-600">*</span></label>
                            <div id="pdf-dropzone" class="border-2 border-dashed border-indigo-200 rounded-2xl p-6 bg-indigo-50/40 hover:bg-indigo-50 hover:border-indigo-400 transition cursor-pointer text-center group relative">
                                <input type="file" id="pdf_solicitud" accept=".pdf" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                                
                                <div id="dropzone-prompt" class="space-y-2">
                                    <div class="w-12 h-12 bg-white rounded-xl text-indigo-600 border border-indigo-100 flex items-center justify-center mx-auto shadow-xs group-hover:scale-105 transition-transform">
                                        <i data-lucide="file-up" class="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <p class="text-sm font-bold text-slate-800">Haga clic o arrastre aquí el documento PDF</p>
                                        <p class="text-xs text-slate-500 mt-0.5">Formato soportado: <span class="font-bold text-indigo-700">PDF (.pdf)</span></p>
                                    </div>
                                </div>

                                <div id="dropzone-selected" class="hidden flex items-center justify-between bg-white p-3.5 rounded-xl border border-indigo-100 shadow-xs">
                                    <div class="flex items-center gap-3 text-left">
                                        <div class="w-9 h-9 rounded-lg bg-rose-100 text-rose-700 flex items-center justify-center font-bold shrink-0">
                                            <i data-lucide="file-text" class="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <p id="file-name-preview" class="text-sm font-bold text-slate-800 truncate max-w-md"></p>
                                            <p id="file-size-preview" class="text-xs text-slate-500 font-medium"></p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2 z-20">
                                        <span class="inline-flex items-center gap-1 text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full">
                                            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Listo
                                        </span>
                                        <button type="button" id="btn-remove-pdf" class="p-1.5 hover:bg-slate-100 text-slate-400 hover:text-slate-600 rounded-lg transition" title="Cambiar archivo">
                                            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- BOTONES DE ACCIÓN -->
                    <div class="flex justify-end items-center gap-4 pt-4 border-t border-slate-100">
                        <a href="index.html" class="px-6 py-3 rounded-xl border border-slate-300 font-bold text-sm text-slate-700 hover:bg-slate-100 transition">Cancelar</a>
                        <button type="submit" id="btn-guardar" class="px-7 py-3 rounded-xl bg-indigo-700 hover:bg-indigo-800 text-white font-bold text-sm shadow-md hover:shadow-indigo-500/20 transition-all flex items-center gap-2 cursor-pointer">
                            <i data-lucide="send" class="w-4 h-4"></i>
                            <span>Crear Solicitud de Trámite</span>
                        </button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script>lucide.createIcons();</script>
    <script src="js/api.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/proceso.js"></script>
</body>

</html>
