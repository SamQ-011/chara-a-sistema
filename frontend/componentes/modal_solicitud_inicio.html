<div id="vista-solicitud-inicio" class="fixed inset-0 bg-slate-50 z-50 hidden flex-col">
    <header class="px-8 py-5 bg-slate-900 text-white flex justify-between items-center shrink-0 shadow-md">
        <div>
            <h2 class="text-2xl font-bold">Solicitud de Inicio de Proceso</h2>
            <p class="text-slate-400 text-sm mt-1">Generación del documento de inicio de contratación</p>
        </div>
        <button onclick="cerrarEditorSolicitudInicio()" class="p-2 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition">
            <i data-lucide="x"></i>
        </button>
    </header>
    
    <div class="flex-1 overflow-y-auto p-8">
        <div class="max-w-4xl mx-auto space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 items-center">
                <div class="col-span-1">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1">Objeto de Contratación</label>
                    <p id="sol-obj" class="text-sm font-semibold text-slate-800 line-clamp-2">...</p>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wide mb-1">Monto Total</label>
                    <p id="sol-monto" class="text-lg font-bold text-emerald-600">...</p>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Fecha del Documento</label>
                    <input type="date" id="sol-fecha" class="w-full border border-slate-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all bg-white">
                </div>
            </div>

            <div class="grid grid-cols-1 gap-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Nombre del Alcalde (MAE)</label>
                    <input type="text" id="sol-alcalde" class="w-full border border-slate-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all" placeholder="Ej. H. Juan Perez">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Objetivo de la Contratación</label>
                    <textarea id="sol-objetivo" rows="4" class="w-full border border-slate-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all" placeholder="Ej. Para el funcionamiento de los centros de salud..."></textarea>
                </div>
            </div>

        </div>
    </div>
    
    <footer class="px-8 py-5 border-t border-slate-200 bg-white flex justify-end gap-4 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <button onclick="cerrarEditorSolicitudInicio()" class="px-6 py-2.5 rounded-xl font-medium text-slate-600 hover:bg-slate-100 transition">Cancelar</button>
        <div class="flex items-center bg-slate-100 rounded-xl p-1 shadow-inner border border-slate-200">
            <button onclick="guardarSolicitudInicio('word')" class="px-6 py-2 text-slate-700 hover:text-blue-700 hover:bg-white hover:shadow-sm rounded-lg transition-all flex items-center gap-2 font-bold disabled:opacity-50 btn-guardar-sol">
                <i data-lucide="file-text" class="w-5 h-5"></i> Emitir Word
            </button>
            <button onclick="guardarSolicitudInicio('pdf')" class="px-6 py-2 text-slate-700 hover:text-red-700 hover:bg-white hover:shadow-sm rounded-lg transition-all flex items-center gap-2 font-bold disabled:opacity-50 btn-guardar-sol">
                <i data-lucide="printer" class="w-5 h-5"></i> Imprimir PDF
            </button>
        </div>
    </footer>
</div>
