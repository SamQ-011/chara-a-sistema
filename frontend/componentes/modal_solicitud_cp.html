<!-- archivo: componentes/modal_solicitud_cp.html -->
<div id="vista-solicitud-cp" class="fixed inset-0 bg-slate-50 z-50 hidden flex-col">
    <!-- Header Pantalla Completa -->
    <header class="px-8 py-5 bg-slate-900 text-white flex justify-between items-center shrink-0 shadow-md">
        <div>
            <h2 class="text-2xl font-bold">Solicitud de Certificación Presupuestaria</h2>
            <p class="text-slate-400 text-sm mt-1">Carga de afectación presupuestaria (POA) e ítems generales del proceso</p>
        </div>
        <button onclick="cerrarEditorSolicitudCP()" class="p-2 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition">
            <i data-lucide="x"></i>
        </button>
    </header>
    
    <!-- Cuerpo Scrollable -->
    <div class="flex-1 overflow-y-auto p-8">
        <div class="max-w-7xl mx-auto space-y-6">
            
            <!-- 1. Datos del Solicitante y Fecha -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Fecha de Solicitud</label>
                    <input type="date" id="cp-fecha" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:border-indigo-500 outline-none font-semibold text-slate-700">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Distrito / Comunidad</label>
                    <input type="text" id="cp-distrito" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:border-indigo-500 outline-none font-semibold text-slate-700" placeholder="Ej. Distrito 1">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Solicitante</label>
                    <input type="text" id="cp-nombre" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-100 text-slate-600 font-semibold outline-none" readonly>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Área / Cargo Solicitante</label>
                    <input type="text" id="cp-cargo" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-100 text-slate-600 font-semibold outline-none" readonly>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Dirigido a (Responsable de Presupuesto y Finanzas)</label>
                    <input type="text" id="cp-encargado-presupuesto" class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:border-indigo-500 outline-none font-semibold text-slate-800" placeholder="Ej. Lic. Adela Dorado Garrado">
                </div>
            </div>

            <!-- 2. Detalle Presupuestario (Gastos POA) -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-5 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                    <div>
                        <h3 class="text-lg font-bold text-slate-800">Estructura de Gastos (Afectación Presupuestaria POA)</h3>
                        <p class="text-xs text-slate-500">Seleccione el Programa, Proyecto/Actividad y Partida desde el Catálogo Municipal</p>
                    </div>
                    <button type="button" onclick="agregarGastoCP()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
                        <i data-lucide="plus" class="w-4 h-4"></i> Agregar Gasto POA
                    </button>
                </div>
                
                <!-- Contenedor de Tarjetas de Gastos (2 Líneas por Gasto) -->
                <div id="cp-contenedor-gastos" class="p-6 space-y-4 bg-slate-50/50"></div>

                <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end items-center gap-4">
                    <span class="text-sm font-bold text-slate-600">Total Presupuestado: Bs. <span id="cp-total-gastos" class="text-xl text-indigo-700 font-black">0.00</span></span>
                </div>
            </div>



        </div>
    </div>

    <!-- Footer Pantalla Completa -->
    <footer class="px-8 py-5 border-t border-slate-200 bg-white flex justify-between items-center shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        
        <!-- SEÑALADOR DINÁMICO (IZQUIERDA) -->
        <div id="cp-status-cuadre" class="flex items-center gap-2">
            <!-- Inyectado dinámicamente desde JS -->
        </div>

        <!-- BOTONES DE ACCIÓN (DERECHA) -->
        <div class="flex items-center gap-4">
            <button onclick="cerrarEditorSolicitudCP()" class="px-6 py-2.5 rounded-xl font-medium text-slate-600 hover:bg-slate-100 transition">Cancelar</button>
            <div id="cp-contenedor-botones" class="flex items-center bg-slate-100 rounded-xl p-1 shadow-inner border border-slate-200 transition-all">
                <button id="btn-guardar-cp-word" onclick="guardarSolicitudCP('word')" class="btn-guardar-cp px-6 py-2 text-slate-700 hover:text-blue-700 hover:bg-white hover:shadow-sm rounded-lg transition-all flex items-center gap-2 font-bold disabled:opacity-40 disabled:pointer-events-none">
                    <i data-lucide="file-text" class="w-5 h-5"></i> Emitir Word
                </button>
                <button id="btn-guardar-cp-pdf" onclick="guardarSolicitudCP('pdf')" class="btn-guardar-cp px-6 py-2 text-slate-700 hover:text-red-700 hover:bg-white hover:shadow-sm rounded-lg transition-all flex items-center gap-2 font-bold disabled:opacity-40 disabled:pointer-events-none">
                    <i data-lucide="printer" class="w-5 h-5"></i> Imprimir PDF
                </button>
            </div>
        </div>
    </footer>
</div>
