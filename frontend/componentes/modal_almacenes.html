<!-- archivo: componentes/modal_almacenes.html -->
<div id="vista-almacenes" class="fixed inset-0 bg-slate-50 z-50 hidden flex-col">
    <header class="px-8 py-5 bg-slate-900 text-white flex justify-between items-center shrink-0 shadow-md">
        <div>
            <h2 class="text-2xl font-bold">Gestión de Almacenes</h2>
            <p class="text-slate-400 text-sm mt-1">Generación simultánea de Notas de Ingreso y Salida de Activos/Bienes</p>
        </div>
        <button onclick="cerrarEditorAlmacenes()" class="p-2 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition">
            <i data-lucide="x"></i>
        </button>
    </header>
    
    <div class="flex-1 overflow-y-auto p-8">
        <div class="max-w-6xl mx-auto space-y-6">
            
            <div class="grid grid-cols-3 gap-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div class="col-span-3">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Proyecto Corto (Para Salida de Almacenes)</label>
                    <input type="text" id="alm-proyecto-corto" class="w-full border border-slate-300 rounded-lg p-2.5 focus:border-indigo-500" placeholder="Ej. Dotación de material de escritorio para el Concejo Municipal...">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Fecha de Ingreso a Almacén</label>
                    <input type="date" id="alm-fecha-ingreso" class="w-full border border-slate-300 rounded-lg p-2.5 focus:border-indigo-500 font-bold text-emerald-700">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Fecha de Salida (Entrega)</label>
                    <input type="date" id="alm-fecha-salida" class="w-full border border-slate-300 rounded-lg p-2.5 focus:border-indigo-500 font-bold text-indigo-700">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Proveedor</label>
                    <input type="text" id="alm-proveedor" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50 font-bold text-slate-700" readonly>
                </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden flex flex-col">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                    <div>
                        <h3 class="text-base font-bold text-slate-800">Detalle Logístico de Bienes</h3>
                        <p class="text-xs text-slate-500 mt-1">Cantidades heredadas de la Orden de Compra. No se permiten modificaciones en esta fase.</p>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-slate-50 text-slate-500 font-semibold border-b border-slate-200">
                            <tr>
                                <th class="px-6 py-3 w-16 text-center">Nro</th>
                                <th class="px-6 py-3">Objeto / Descripción</th>
                                <th class="px-6 py-3 w-32">Unidad</th>
                                <th class="px-6 py-3 w-32 text-center">Cantidad Física</th>
                            </tr>
                        </thead>
                        <tbody id="alm-tabla-items" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <footer class="px-8 py-5 border-t border-slate-200 bg-white flex justify-end gap-4 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <button onclick="cerrarEditorAlmacenes()" class="px-6 py-2.5 rounded-xl font-medium text-slate-600 hover:bg-slate-100 transition">Cancelar</button>
        <div class="flex items-center bg-slate-100 rounded-xl p-1 shadow-inner border border-slate-200">
            <button onclick="guardarAlmacenes('word')" class="px-6 py-2 text-slate-700 hover:text-blue-700 hover:bg-white hover:shadow-sm rounded-lg transition-all flex items-center gap-2 font-bold disabled:opacity-50 btn-guardar-alm">
                <i data-lucide="file-text" class="w-5 h-5"></i> Emitir Word
            </button>
            <button onclick="guardarAlmacenes('pdf')" class="px-6 py-2 text-slate-700 hover:text-red-700 hover:bg-white hover:shadow-sm rounded-lg transition-all flex items-center gap-2 font-bold disabled:opacity-50 btn-guardar-alm">
                <i data-lucide="printer" class="w-5 h-5"></i> Imprimir PDF
            </button>
        </div>
    </footer>
</div>
