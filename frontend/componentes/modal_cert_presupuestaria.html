<!-- archivo: componentes/modal_cert_presupuestaria.html -->
<div id="vista-certificacion" class="fixed inset-0 bg-slate-50 z-50 hidden flex-col">
    <header class="px-8 py-5 bg-slate-900 text-white flex justify-between items-center shrink-0 shadow-md">
        <div>
            <h2 class="text-2xl font-bold">Certificación Presupuestaria</h2>
            <p class="text-slate-400 text-sm mt-1">Asignación de Fuente y Organismo (FF/OF) para las partidas de gasto</p>
        </div>
        <button onclick="cerrarEditorCertificacion()" class="p-2 hover:bg-slate-700 rounded-full text-slate-400 hover:text-white transition">
            <i data-lucide="x"></i>
        </button>
    </header>
    
    <div class="flex-1 overflow-y-auto p-8">
        <div class="max-w-7xl mx-auto space-y-6">
            
            <div class="grid grid-cols-3 gap-6 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Nombre Solicitante</label>
                    <input type="text" id="cert-nombre" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50" readonly>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Cargo Solicitante</label>
                    <input type="text" id="cert-cargo" class="w-full border border-slate-300 rounded-lg p-2.5 bg-slate-50" readonly>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Fecha Emisión</label>
                    <input type="date" id="cert-fecha" class="w-full border border-slate-300 rounded-lg p-2.5 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition-all">
                </div>
            </div>

            <div class="flex items-center justify-between px-2 pt-2">
                <h3 class="text-lg font-bold text-slate-800">Afectación Presupuestaria</h3>
                <span class="text-sm text-slate-500">Complete los campos de Fuente (FF) y Organismo (OF)</span>
            </div>
            
            <!-- CONTENEDOR DINÁMICO: Aquí el JS inyectará las tarjetas agrupadas por Programa/Proyecto -->
            <div id="cert-contenedor-tablas" class="space-y-8">
            </div>
            
        </div>
    </div>

    <footer class="px-8 py-5 border-t border-slate-200 bg-white flex justify-end gap-4 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
        <button onclick="cerrarEditorCertificacion()" class="px-6 py-2.5 rounded-xl font-medium text-slate-600 hover:bg-slate-100 transition">Cancelar</button>
        <div class="flex items-center bg-slate-100 rounded-xl p-1 shadow-inner border border-slate-200">
            <button id="btn-guardar-cert-word" onclick="guardarCertificacion('word')" class="px-6 py-2 text-slate-700 hover:text-blue-700 hover:bg-white hover:shadow-sm rounded-lg transition-all flex items-center gap-2 font-bold disabled:opacity-50">
                <i data-lucide="file-text" class="w-5 h-5"></i> Emitir Word
            </button>
            <button id="btn-guardar-cert-pdf" onclick="guardarCertificacion('pdf')" class="px-6 py-2 text-slate-700 hover:text-red-700 hover:bg-white hover:shadow-sm rounded-lg transition-all flex items-center gap-2 font-bold disabled:opacity-50">
                <i data-lucide="printer" class="w-5 h-5"></i> Imprimir PDF
            </button>
        </div>
    </footer>
</div>
